name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build exe + installer
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: Nuclear Option Mod Manager (exe)
          path: dist/Nuclear Option Mod Manager.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Nuclear Option Mod Manager (installer)
          path: dist_installer/Nuclear Option Mod Manager Setup.exe
